<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVENT 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#011f01;
    --bg2:#083108;
    --color1:#011f01;
    --color2:#106310;
    --text1:#09ad09;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background-image: linear-gradient(90deg, var(--bg), var(--bg2), var(--bg));
    color:var(--text1);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: background .6s ease; /* pratique si tu changes le fond par palier */
  }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:2rem;
  }

  #counter{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(2.8rem, 11vw, 7.5rem);
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color: var(--text1);
    transition:transform .18s ease, color .3s ease;
  }
  #counter.bump{transform:scale(1.035);}

  .donate-btn{
    margin-top:2.25rem;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    padding:.9rem 2rem;
    border-radius:999px;
    background:var(--color1);
    color:#fff;
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    box-shadow:0 8px 30px -8px rgba(23,114,17,.93);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .donate-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 34px -6px rgb(50,147,71);
    background:#021402;
  }
  .donate-btn:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--color2);
    outline-offset:3px;
  }

  /* ==========================================================
     CLASSES DE PALIER
     ==========================================================
     Dès qu'un palier est franchi, la classe correspondante est
     posée sur <body> (et retirée au palier suivant) :

       body.tier-tier1
       body.tier-tier2
       body.tier-tier3
       body.tier-tier4
       body.tier-record

     Exemple d'utilisation (à remplir toi-même) :
  */
  body.tier-tier1  { }
  body.tier-tier2  { }
  body.tier-tier3  { }
  body.tier-tier4  { }
  body.tier-record { }

  /* --- panneau de test --- */
  #test-toggle{
    position:fixed;
    bottom:1.25rem;
    right:1.25rem;
    z-index:10;
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:var(--text1);
    font-size:1.1rem;
    cursor:pointer;
    backdrop-filter:blur(6px);
  }

  #test-panel{
    position:fixed;
    bottom:4.25rem;
    right:1.25rem;
    z-index:10;
    width:300px;
    max-height:75vh;
    overflow-y:auto;
    background:rgba(14,15,28,.92);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:1.1rem;
    backdrop-filter:blur(10px);
    display:none;
    font-size:.85rem;
    color:#eee;
  }
  #test-panel.open{display:block;}
  #test-panel h2{font-size:.95rem;margin-bottom:.75rem;font-family:'Space Grotesk',sans-serif;}
  #test-panel h3{font-size:.72rem;margin:.9rem 0 .4rem;color:#aaa;}
  #test-panel .row{display:flex;gap:.4rem;margin-bottom:.4rem;}
  #test-panel input[type=number]{
    flex:1;min-width:0;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    color:#eee;
    padding:.45rem .55rem;
  }
  #test-panel button{
    background:rgba(124,92,255,.18);
    border:1px solid rgba(124,92,255,.4);
    color:#eee;
    border-radius:8px;
    padding:.45rem .6rem;
    cursor:pointer;
    font-size:.78rem;
  }
  #test-panel button:hover{background:rgba(124,92,255,.32);}
  #test-panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
  #test-panel .status{
    margin-top:.9rem;
    padding:.5rem .6rem;
    border-radius:8px;
    background:rgba(255,255,255,.05);
    color:#ccc;
    line-height:1.4;
  }
  #test-panel label.check{display:flex;align-items:center;gap:.4rem;margin-top:.6rem;color:#ccc;}

  @media (prefers-reduced-motion: reduce){
    #counter{transition:none !important;}
  }
</style>
</head>
<body>

  <main>
    <h1 id="counter">0,00€</h1>
    <a class="donate-btn" href="https://zevent.fr/don" target="_blank" rel="noopener">Faire un don</a>
  </main>

  <button id="test-toggle" title="Panneau de test">🧪</button>
  <div id="test-panel">
    <h2>Panneau de test</h2>

    <h3>Définir une valeur</h3>
    <div class="row">
      <input type="number" id="manual-value" placeholder="ex: 2500000.50" step="0.01">
      <button id="manual-set">Définir</button>
    </div>

    <h3>Aller directement à un palier</h3>
    <div class="grid">
      <button data-jump="300000">Tier 1 · 300k</button>
      <button data-jump="1000000">Tier 2 · 1M</button>
      <button data-jump="10000000">Tier 3 · 10M</button>
      <button data-jump="20000000">Tier 4 · 20M</button>
      <button data-jump="16179096">Record</button>
      <button id="btn-reset">Réinitialiser</button>
    </div>

    <label class="check">
      <input type="checkbox" id="sim-toggle">
      Simulation automatique (incrémente seul)
    </label>

    <div class="status" id="status-box">initialisation…</div>
  </div>

<script>
/* =========================================================
   CONFIGURATION DE L'API
   =========================================================
   1) API_URL : l'adresse qui renvoie le JSON de la cagnotte.
      -> Mets ici l'URL réelle de l'API ZEVENT (ou ton propre
         proxy si l'API officielle bloque le CORS depuis le
         navigateur — c'est très souvent le cas : dans ce cas,
         fais tourner un petit serveur relais côté back-end qui
         récupère le JSON et le sert avec les bons headers CORS,
         puis mets ICI l'URL de TON relais).

   2) VALUE_PATH : n'est utilisé QUE si ta réponse JSON n'est ni
      un objet avec un champ numérique évident (donationAmount,
      total, montant, etc.) ni un tableau "live" façon API ZEVENT.
      Exemple : si ton JSON ressemble à
        { "data": { "cagnotte": 532730.49 } }
      alors VALUE_PATH = ["data","cagnotte"]

   3) POLL_INTERVAL_MS : fréquence d'actualisation en millisecondes.
      5000 = toutes les 5 secondes. Ne descends pas trop bas pour
      éviter de te faire limiter par l'API (rate limit).

   4) RECORD_VALUE : le montant du record à dépasser pour
      déclencher le palier "record".
   ========================================================= */
const CONFIG = {
  API_URL: "https://zevent.fr/api/",   // <-- mets ton URL ici, ou "" pour rester en mode démo
  VALUE_PATH: ["donationAmount", "number"],
  POLL_INTERVAL_MS: 5000,
  RECORD_VALUE: 16179096,
};

/* =========================================================
   Paliers
   ========================================================= */
function buildMilestones(){
  const arr = [];
  for(let v=100000; v<=900000; v+=100000) arr.push({value:v, tier:"tier1"});
  [1000000,1500000,2000000,2500000].forEach(v=>arr.push({value:v, tier:"tier2"}));
  for(let v=3000000; v<=9000000; v+=1000000) arr.push({value:v, tier:"tier2"});
  for(let v=10000000; v<=19000000; v+=1000000) arr.push({value:v, tier:"tier3"});
  for(let v=20000000; v<=60000000; v+=1000000) arr.push({value:v, tier:"tier4"});
  arr.push({value: CONFIG.RECORD_VALUE, tier:"record"});
  arr.sort((a,b)=>a.value-b.value);
  return arr;
}
const MILESTONES = buildMilestones();

/* =========================================================
   Formatage : "XX XXX XXX,XX€"  (avec décimales)
   ========================================================= */
function formatEuro(n){
  const neg = n < 0;
  n = Math.abs(n);
  const fixed = n.toFixed(2);              // "1234567.89"
  let [intPart, decPart] = fixed.split(".");
  const groups = [];
  while(intPart.length > 3){
    groups.unshift(intPart.slice(-3));
    intPart = intPart.slice(0, -3);
  }
  groups.unshift(intPart);
  return (neg ? "-" : "") + groups.join(" ") + "," + decPart + "€";
}

/* =========================================================
   État persistant (localStorage)
   ========================================================= */
const STORE_KEY = "zevent-counter-state-v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { lastValue: null, played: [] };
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    lastValue: state.lastValue,
    played: Array.from(state.played),
  }));
}
const state = loadState();
state.played = new Set(state.played || []);

/* =========================================================
   Animation du compteur (comptage progressif)
   ========================================================= */
const counterEl = document.getElementById("counter");
let displayedValue = state.lastValue || 0;
counterEl.textContent = formatEuro(displayedValue);

function animateCounterTo(target, duration=1200){
  const start = displayedValue;
  const delta = target - start;
  if(delta === 0) return;
  const startTime = performance.now();
  counterEl.classList.add("bump");
  function frame(now){
    const p = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
    displayedValue = start + delta * eased;
    counterEl.textContent = formatEuro(displayedValue);
    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      displayedValue = target;
      counterEl.textContent = formatEuro(target);
      counterEl.classList.remove("bump");
    }
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   Application de la classe de palier sur <body>
   =========================================================
   À chaque fois qu'un nouveau palier est atteint, on retire
   l'ancienne classe "tier-*" et on pose la nouvelle : tu n'as
   plus qu'à écrire du CSS pour body.tier-tier1, .tier-tier2,
   .tier-tier3, .tier-tier4, .tier-record dans le bloc dédié
   plus haut dans le <style>.
   ========================================================= */
function applyTierClass(tier){
  document.body.classList.remove("tier-tier1","tier-tier2","tier-tier3","tier-tier4","tier-record");
  document.body.classList.add("tier-" + tier);
}

/* =========================================================
   Logique métier : détection des paliers franchis
   ========================================================= */
function handleNewValue(newValue, {silent=false} = {}){
  const oldValue = state.lastValue == null ? newValue : state.lastValue;
  let lastTierReached = null;

  if(state.lastValue == null){
    // première visite : on marque comme "déjà vus" tous les
    // paliers déjà atteints, sans déclencher de style.
    MILESTONES.forEach(m=>{
      if(m.value <= newValue){
        state.played.add(m.value);
        lastTierReached = m.tier;
      }
    });
  } else if(newValue > oldValue){
    MILESTONES.forEach(m=>{
      if(m.value > oldValue && m.value <= newValue){
        if(!state.played.has(m.value) && !silent){
          state.played.add(m.value);
        } else {
          state.played.add(m.value);
        }
        lastTierReached = m.tier;
      }
    });
  }

  if(lastTierReached) applyTierClass(lastTierReached);

  state.lastValue = newValue;
  saveState();
  animateCounterTo(newValue);
}

/* =========================================================
   Récupération des données (API réelle ou simulation)
   ========================================================= */
const statusBox = document.getElementById("status-box");
function setStatus(text){ statusBox.textContent = text; }

function extractValue(json){
  if(json && typeof json === "object"){
    const candidates = ["donationAmount","total","totalAmount","donationTotal","cagnotte","montant","amount"];
    for(const key of candidates){
      const val = json[key];
      if(typeof val === "number") return val;
      if(val && typeof val.number === "number") return val.number;
    }
    for(const key of Object.keys(json)){
      if(key === "live") continue;
      const val = json[key];
      if(typeof val === "number") return val;
      if(val && typeof val.number === "number") return val.number;
    }
  }
  if(json && Array.isArray(json.live)){
    return json.live.reduce((sum, streamer) => {
      const n = streamer?.donationAmount?.number;
      return sum + (typeof n === "number" ? n : 0);
    }, 0);
  }
  let v = json;
  for(const key of CONFIG.VALUE_PATH) v = v?.[key];
  return typeof v === "number" ? v : null;
}

let pollTimer = null;

async function pollOnce(){
  if(!CONFIG.API_URL){
    setStatus("Mode démo — définissez CONFIG.API_URL dans le code pour brancher l'API réelle.");
    return;
  }
  try{
    const res = await fetch(CONFIG.API_URL);
    const json = await res.json();
    const value = extractValue(json);
    if(value == null) throw new Error("Chemin JSON introuvable, vérifiez CONFIG.VALUE_PATH");
    handleNewValue(value);
    setStatus("Dernière valeur reçue : " + formatEuro(value));
  }catch(err){
    setStatus("Erreur API (" + err.message + "). Vérifiez CORS / l'URL.");
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollOnce();
  pollTimer = setInterval(pollOnce, CONFIG.POLL_INTERVAL_MS);
}
startPolling();

if(!CONFIG.API_URL && state.lastValue == null){
  handleNewValue(50000.00, {silent:true});
}

/* =========================================================
   Panneau de test
   ========================================================= */
const testToggle = document.getElementById("test-toggle");
const testPanel = document.getElementById("test-panel");
testToggle.addEventListener("click", ()=> testPanel.classList.toggle("open"));
window.addEventListener("keydown", e=>{
  if(e.key.toLowerCase() === "t" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){
    testPanel.classList.toggle("open");
  }
});

document.getElementById("manual-set").addEventListener("click", ()=>{
  const val = parseFloat(document.getElementById("manual-value").value);
  if(!isNaN(val)) handleNewValue(val);
});

document.querySelectorAll("[data-jump]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    handleNewValue(parseFloat(btn.dataset.jump));
  });
});

document.getElementById("btn-reset").addEventListener("click", ()=>{
  localStorage.removeItem(STORE_KEY);
  location.reload();
});

let simTimer = null;
document.getElementById("sim-toggle").addEventListener("change", (e)=>{
  if(e.target.checked){
    if(pollTimer) clearInterval(pollTimer);
    setStatus("Simulation automatique en cours…");
    simTimer = setInterval(()=>{
      const next = (state.lastValue || 0) + (2000 + Math.random()*40000);
      handleNewValue(next);
    }, 1800);
  } else {
    if(simTimer) clearInterval(simTimer);
    startPolling();
  }
});
</script>
</body>
</html>
