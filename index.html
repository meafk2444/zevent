<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEVENT 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#011f01;
    --bg2:#083108;
    --color1:#011f01;
    --color2:#106310;
    --text1:#09ad09;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background-image: linear-gradient(90deg, var(--bg), var(--bg2), var(--bg));
    color:var(--text1);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: background .6s ease;
  }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:2rem;
  }

  #counter{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(2.8rem, 11vw, 7.5rem);
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color: var(--text1);
    transition:transform .18s ease, color .3s ease;
  }
  #counter.bump{transform:scale(1.035);}

  .donate-btn{
    margin-top:2.25rem;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    padding:.9rem 2rem;
    border-radius:999px;
    background:var(--color1);
    color:#fff;
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    box-shadow:0 8px 30px -8px rgba(23,114,17,.93);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .donate-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 34px -6px rgb(50,147,71);
    background:#021402;
  }
  .donate-btn:focus-visible, button:focus-visible{
    outline:2px solid var(--color2);
    outline-offset:3px;
  }

  /* ==========================================================
     CLASSES DE PALIER (posées sur <body>, en plus des effets)
     ========================================================== */
  body.tier-tier1  { }
  body.tier-tier2  { }
  body.tier-tier3  { }
  body.tier-tier4  { }
  body.tier-record { }

  /* ==========================================================
     COUCHE D'EFFETS PLEIN ÉCRAN
     ========================================================== */
  #fx-canvas{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
  }

  #flash{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at 50% 45%, transparent, transparent 70%);
  }

  /* Gros chiffre : version simple et plate, pas d'effet 3D/glossy */
  #big-number{
    position:fixed;
    inset:0;
    z-index:7;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
  }
  #big-number.show{ opacity:1; }
  #big-number .circle{
    min-width:min(60vw, 420px);
    padding:1.5rem 2.5rem;
    border-radius:24px;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem, 6vw, 3.2rem);
    color:#fff;
    background:var(--color2);
    transform:scale(.85);
    transition:transform .3s ease;
  }
  #big-number.show .circle{ transform:scale(1); }

  @keyframes shake{
    10%,90%{transform:translate3d(-2px,0,0);}
    20%,80%{transform:translate3d(4px,0,0);}
    30%,50%,70%{transform:translate3d(-8px,0,0);}
    40%,60%{transform:translate3d(8px,0,0);}
  }
  body.shake{ animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }

  /* --- boutons flottants : plein écran dans le coin, mute juste à côté --- */
  .icon-btn{
    position:fixed;
    bottom:1.25rem;
    z-index:10;
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:var(--text1);
    cursor:pointer;
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn svg{ width:20px; height:20px; }
  #fullscreen-toggle{ right:1.25rem; }
  #mute-toggle{ right:5.25rem; }

  @media (prefers-reduced-motion: reduce){
    #counter, body.shake, #big-number .circle{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>
  <div id="flash"></div>
  <div id="big-number"><div class="circle"></div></div>

  <main>
    <h1 id="counter">0,00€</h1>
    <a class="donate-btn" href="https://zevent.fr/don" target="_blank" rel="noopener">Faire un don</a>
  </main>

  <button id="fullscreen-toggle" class="icon-btn" title="Plein écran">
    <svg id="icon-fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <svg id="icon-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
      <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
      <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
      <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
    </svg>
  </button>

  <button id="mute-toggle" class="icon-btn" title="Couper le son">
    <svg id="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
    <svg id="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  </button>

<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */
const CONFIG = {
  API_URL: "https://zeventapi.meafk80.workers.dev/",
  VALUE_PATH: ["donationAmount", "number"],
  POLL_INTERVAL_MS: 5000,
  RECORD_VALUE: 16179096,

  DEFAULT_MUTED: false,

  /* =======================================================
     RÉGLAGES PAR PALIER
       durationMs          -> durée totale de l'effet (ms) et
                               temps d'attente avant l'effet suivant
       confettiBursts      -> nombre de vagues de confettis (0 = off)
       fireworksBursts     -> nombre de bouquets de feu d'artifice (0 = off)
       colors              -> couleurs des particules
       flashColor          -> couleur du flash plein écran (rgba)
       flashDurationMs     -> durée du fondu du flash
       shake               -> true/false
       bigNumber           -> true/false, affiche le montant en grand
       bigNumberDurationMs -> durée d'affichage
       sound               -> mets ici l'URL de TON fichier son, ex :
                               "https://tonsite.com/sons/tier2.mp3"
                               (laisse null pour un bip généré automatiquement)
       soundVolume         -> 0 à 1
       beepFrequency       -> fréquence du bip auto (Hz), ignoré si "sound" est défini
     ======================================================= */
  TIERS: {
    tier1: {
      durationMs: 10000,
      confettiBursts: 10,
      fireworksBursts: 0,
      colors: ["#09ad09", "#1c8a1c", "#ffffff"],
      flashColor: "rgba(9,173,9,0.35)",
      flashDurationMs: 3000,
      shake: false,
      bigNumber: false,
      bigNumberDurationMs: 4000,
      sound: null,
      soundVolume: 0.5,
      beepFrequency: 440,
    },
    tier2: {
      durationMs: 15000,
      confettiBursts: 20,
      fireworksBursts: 1,
      colors: ["#09ad09", "#1c8a1c", "#ffffff", "#ffe08a"],
      flashColor: "rgba(9,173,9,0.5)",
      flashDurationMs: 650,
      shake: false,
      bigNumber: true,
      bigNumberDurationMs: 10000,
      sound: null,
      soundVolume: 0.6,
      beepFrequency: 523,
    },
    tier3: {
      durationMs: 18000,
      confettiBursts: 30,
      fireworksBursts: 4,
      colors: ["#ffffff", "#ffe08a", "#09ad09"],
      flashColor: "rgba(255,255,255,0.5)",
      flashDurationMs: 800,
      shake: true,
      bigNumber: true,
      bigNumberDurationMs: 15000,
      sound: null,
      soundVolume: 0.7,
      beepFrequency: 659,
    },
    tier4: {
      durationMs: 22200,
      confettiBursts: 45,
      fireworksBursts: 7,
      colors: ["#ffffff", "#ffe08a", "#09ad09", "#ffd23c"],
      flashColor: "rgba(255,255,255,0.65)",
      flashDurationMs: 950,
      shake: true,
      bigNumber: true,
      bigNumberDurationMs: 20000,
      sound: null,
      soundVolume: 0.8,
      beepFrequency: 784,
    },
    record: {
      durationMs: 1000000,
      confettiBursts: 200,
      fireworksBursts: 40,
      colors: ["#ffd23c", "#ffffff", "#09ad09", "#ffe08a"],
      flashColor: "rgba(255,210,60,0.75)",
      flashDurationMs: 5000,
      shake: true,
      bigNumber: true,
      bigNumberDurationMs: 100000,
      sound: null,
      soundVolume: 1,
      beepFrequency: 988,
    },
  },
};

/* =========================================================
   Paliers
   ========================================================= */
function buildMilestones(){
  const arr = [];
  for(let v=100000; v<=900000; v+=100000) arr.push({value:v, tier:"tier1"});
  [1000000,1500000,2000000,2500000].forEach(v=>arr.push({value:v, tier:"tier2"}));
  for(let v=3000000; v<=9000000; v+=1000000) arr.push({value:v, tier:"tier2"});
  for(let v=10000000; v<=19000000; v+=1000000) arr.push({value:v, tier:"tier3"});
  for(let v=20000000; v<=60000000; v+=1000000) arr.push({value:v, tier:"tier4"});
  arr.push({value: CONFIG.RECORD_VALUE, tier:"record"});
  arr.sort((a,b)=>a.value-b.value);
  return arr;
}
const MILESTONES = buildMilestones();

/* =========================================================
   Formatage : "XX XXX XXX,XX€"
   ========================================================= */
function formatEuro(n){
  const neg = n < 0;
  n = Math.abs(n);
  const fixed = n.toFixed(2);
  let [intPart, decPart] = fixed.split(".");
  const groups = [];
  while(intPart.length > 3){
    groups.unshift(intPart.slice(-3));
    intPart = intPart.slice(0, -3);
  }
  groups.unshift(intPart);
  return (neg ? "-" : "") + groups.join(" ") + "," + decPart + "€";
}

/* =========================================================
   État persistant (localStorage)
   ========================================================= */
const STORE_KEY = "zevent-counter-state-v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { lastValue: null, played: [] };
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    lastValue: state.lastValue,
    played: Array.from(state.played),
  }));
}
const state = loadState();
state.played = new Set(state.played || []);

/* =========================================================
   Animation du compteur (comptage progressif)
   ========================================================= */
const counterEl = document.getElementById("counter");
let displayedValue = state.lastValue || 0;
counterEl.textContent = formatEuro(displayedValue);

function animateCounterTo(target, duration=1200){
  const start = displayedValue;
  const delta = target - start;
  if(delta === 0) return;
  const startTime = performance.now();
  counterEl.classList.add("bump");
  function frame(now){
    const p = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    displayedValue = start + delta * eased;
    counterEl.textContent = formatEuro(displayedValue);
    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      displayedValue = target;
      counterEl.textContent = formatEuro(target);
      counterEl.classList.remove("bump");
    }
  }
  requestAnimationFrame(frame);
}

function applyTierClass(tier){
  document.body.classList.remove("tier-tier1","tier-tier2","tier-tier3","tier-tier4","tier-record");
  document.body.classList.add("tier-" + tier);
}

/* =========================================================
   Son : bip généré automatiquement OU fichier fourni
   ========================================================= */
let isMuted = localStorage.getItem("zevent-muted") !== null
  ? localStorage.getItem("zevent-muted") === "true"
  : CONFIG.DEFAULT_MUTED;

let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
window.addEventListener("pointerdown", () => ensureAudioCtx(), { once: true });

function playBeep(freq = 440, durationMs = 350, volume = 0.5){
  if(isMuted) return;
  const ctx = ensureAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs / 1000);
  osc.stop(ctx.currentTime + durationMs / 1000);
}

function playTierSound(config){
  if(isMuted) return;
  if(config.sound){
    const audio = new Audio(config.sound);
    audio.volume = config.soundVolume ?? 0.6;
    audio.play().catch(() => {});
  } else {
    playBeep(config.beepFrequency || 440, 350, config.soundVolume ?? 0.5);
  }
}

const muteToggle = document.getElementById("mute-toggle");
const iconUnmuted = document.getElementById("icon-unmuted");
const iconMuted = document.getElementById("icon-muted");
function updateMuteIcon(){
  iconUnmuted.style.display = isMuted ? "none" : "block";
  iconMuted.style.display = isMuted ? "block" : "none";
}
updateMuteIcon();
muteToggle.addEventListener("click", () => {
  isMuted = !isMuted;
  localStorage.setItem("zevent-muted", isMuted);
  updateMuteIcon();
});

/* =========================================================
   Plein écran
   ========================================================= */
const fullscreenToggle = document.getElementById("fullscreen-toggle");
const iconFsEnter = document.getElementById("icon-fs-enter");
const iconFsExit = document.getElementById("icon-fs-exit");
fullscreenToggle.addEventListener("click", () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener("fullscreenchange", () => {
  const active = !!document.fullscreenElement;
  iconFsEnter.style.display = active ? "none" : "block";
  iconFsExit.style.display = active ? "block" : "none";
});

/* =========================================================
   Système de particules plein écran (canvas)
   ========================================================= */
const canvas = document.getElementById("fx-canvas");
const ctx2d = canvas.getContext("2d");
function resizeCanvas(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx2d.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
function spawnBurst({x, y, count, colors, speed, gravity, life, size}){
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const v = speed * (0.4 + Math.random()*0.6);
    particles.push({
      x, y,
      vx: Math.cos(angle)*v,
      vy: Math.sin(angle)*v - v*0.3,
      gravity,
      life, age:0,
      size: size*(0.6+Math.random()*0.8),
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.3,
    });
  }
}

let particleLoopRunning = false;
function particleLoop(){
  ctx2d.clearRect(0,0,window.innerWidth, window.innerHeight);
  particles.forEach(p=>{
    p.age++;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rot += p.vrot;
    const lifeRatio = p.age / p.life;
    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, 1 - lifeRatio);
    ctx2d.translate(p.x, p.y);
    ctx2d.rotate(p.rot);
    ctx2d.fillStyle = p.color;
    ctx2d.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    ctx2d.restore();
  });
  particles = particles.filter(p => p.age < p.life);
  if(particles.length > 0 || particleLoopRunning){
    requestAnimationFrame(particleLoop);
  } else {
    particleLoopRunning = false;
  }
}
function ensureLoop(){
  if(!particleLoopRunning){
    particleLoopRunning = true;
    requestAnimationFrame(particleLoop);
  }
}

function confetti(bursts, colors){
  const w = window.innerWidth;
  for(let i=0;i<bursts;i++){
    spawnBurst({
      x: Math.random()*w, y: -20,
      count: 6, colors, speed: 3, gravity: 0.12, life: 140, size: 8,
    });
  }
  ensureLoop();
}

function fireworks(bursts, colors){
  for(let i=0;i<bursts;i++){
    setTimeout(()=>{
      const x = window.innerWidth * (0.15 + Math.random()*0.7);
      const y = window.innerHeight * (0.15 + Math.random()*0.45);
      spawnBurst({x,y, count:70, colors, speed:5.5, gravity:0.05, life:90, size:5});
      ensureLoop();
    }, i*220);
  }
}

/* =========================================================
   Flash de fond plein écran
   ========================================================= */
function flashScreen(color, duration=600){
  const flash = document.getElementById("flash");
  flash.style.background = `radial-gradient(circle at 50% 45%, ${color}, transparent 70%)`;
  flash.style.transition = "none";
  flash.style.opacity = "0.9";
  requestAnimationFrame(()=>{
    flash.style.transition = `opacity ${duration}ms ease`;
    flash.style.opacity = "0";
  });
}

function shakeScreen(){
  document.body.classList.remove("shake");
  void document.body.offsetWidth;
  document.body.classList.add("shake");
}

/* =========================================================
   Gros chiffre (version simple, sans effet 3D)
   ========================================================= */
const bigNumberEl = document.getElementById("big-number");
let bigNumberTimer = null;
function showBigNumber(value, duration=1800){
  bigNumberEl.querySelector(".circle").textContent = formatEuro(value);
  bigNumberEl.classList.add("show");
  clearTimeout(bigNumberTimer);
  bigNumberTimer = setTimeout(()=> bigNumberEl.classList.remove("show"), duration);
}

/* =========================================================
   Déclenchement de l'effet complet pour un palier
   ========================================================= */
function playTierAnimation(tier, value){
  const config = CONFIG.TIERS[tier];
  if(!config) return;

  applyTierClass(tier);
  if(config.bigNumber) showBigNumber(value, config.bigNumberDurationMs || config.durationMs);
  if(config.confettiBursts) confetti(config.confettiBursts, config.colors);
  if(config.fireworksBursts) fireworks(config.fireworksBursts, config.colors);
  if(config.flashColor) flashScreen(config.flashColor, config.flashDurationMs || 600);
  if(config.shake) shakeScreen();
  playTierSound(config);
}

/* =========================================================
   File d'attente : évite que plusieurs paliers franchis d'un
   coup ne déclenchent leurs effets en même temps
   ========================================================= */
let animationQueue = [];
let queueRunning = false;
function queueMilestone(tier, value){
  animationQueue.push({tier, value});
  if(!queueRunning) processQueue();
}
function processQueue(){
  if(animationQueue.length === 0){ queueRunning = false; return; }
  queueRunning = true;
  const next = animationQueue.shift();
  playTierAnimation(next.tier, next.value);
  const wait = (CONFIG.TIERS[next.tier]?.durationMs) || 1500;
  setTimeout(processQueue, wait);
}

/* =========================================================
   Logique métier : détection des paliers franchis
   ========================================================= */
function handleNewValue(newValue, {silent=false} = {}){
  const oldValue = state.lastValue == null ? newValue : state.lastValue;

  if(state.lastValue == null){
    let lastTier = null;
    MILESTONES.forEach(m=>{
      if(m.value <= newValue){
        state.played.add(m.value);
        lastTier = m.tier;
      }
    });
    if(lastTier) applyTierClass(lastTier);
  } else if(newValue > oldValue && !silent){
    MILESTONES.forEach(m=>{
      if(m.value > oldValue && m.value <= newValue && !state.played.has(m.value)){
        state.played.add(m.value);
        queueMilestone(m.tier, m.value);
      }
    });
  }

  state.lastValue = newValue;
  saveState();
  animateCounterTo(newValue);
}

/* =========================================================
   Récupération des données (API)
   ========================================================= */
function extractValue(json){
  if(json && typeof json === "object"){
    const candidates = ["donationAmount","total","totalAmount","donationTotal","cagnotte","montant","amount"];
    for(const key of candidates){
      const val = json[key];
      if(typeof val === "number") return val;
      if(val && typeof val.number === "number") return val.number;
    }
    for(const key of Object.keys(json)){
      if(key === "live") continue;
      const val = json[key];
      if(typeof val === "number") return val;
      if(val && typeof val.number === "number") return val.number;
    }
  }
  if(json && Array.isArray(json.live)){
    return json.live.reduce((sum, streamer) => {
      const n = streamer?.donationAmount?.number;
      return sum + (typeof n === "number" ? n : 0);
    }, 0);
  }
  let v = json;
  for(const key of CONFIG.VALUE_PATH) v = v?.[key];
  return typeof v === "number" ? v : null;
}

let pollTimer = null;

async function pollOnce(){
  if(!CONFIG.API_URL) return;
  try{
    const res = await fetch(CONFIG.API_URL);
    const json = await res.json();
    const value = extractValue(json);
    if(value != null) handleNewValue(value);
  }catch(err){
    console.error("Erreur API :", err);
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollOnce();
  pollTimer = setInterval(pollOnce, CONFIG.POLL_INTERVAL_MS);
}
startPolling();
</script>
</body>
</html>
